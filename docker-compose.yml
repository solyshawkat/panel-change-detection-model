version: "3.9"

services:
  # ── PCD-AI Service ──
  pcd-ai:
    build: .
    container_name: pcd-ai-service
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./ml_models:/app/ml_models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    container_name: pcd-ai-db
    environment:
      POSTGRES_DB: pcd_ai
      POSTGRES_USER: pcd_user
      POSTGRES_PASSWORD: pcd_pass
    ports:
      - "5433:5432"  # 5433 externally to avoid conflicts with Eden's PostgreSQL
    volumes:
      - pcd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcd_user -d pcd_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pcd_pgdata:
